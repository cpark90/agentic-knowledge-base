# ASAM OpenODD 1.0 YAML 매핑 참조의 모양을 따른다 (Release Presentation 2025-04-03 slide 6·8, 명세 §6.4·§10.2).
# 이 문서가 원본이고 project-odd.ttl 은 생성물이다 (bazel build //kb/odd:odd).
# OpenODD 키: IMPORT · TAXONOMY · MODULES(모듈 id 아래 INCLUDE_AND/INCLUDE_OR/EXCLUDE_AND/EXCLUDE_OR, title·is_root·is_active).
# 식: 범주 리터럴 / "< n unit" / "> n unit" / "[a .. b] unit" / unknown.  MODULE = INCLUDE ∧ ¬EXCLUDE.
# 확장 키(OpenODD 밖, 이 체계의 것): ATTRIBUTES(속성 ↔ 그래프 IRI·라벨) · LITERALS(리터럴의 뜻) · CHECKS(판정 방법·등급, 3.2절) ·
#   EXCLUSIONS_REVIEWED(명시 제외, 3.2절) · EXCLUDE_WHEN_UNKNOWN(= restrictive, 0.4절).

IMPORT: taxonomy.yml                 # kb/ontology/related/condition 에서 생성 — 범주 3 (static_element · environmental_condition · dynamic_element)

TAXONOMY:                            # 프로젝트 확장 — 범주 아래 속성(조건). 범주 키는 taxonomy.yml 에 있어야 한다
  static_element:
    build_system: [bazel_9_2_bzlmod]
    python_runtime: [hermetic_python_3_11]
    repository_layout: [kb_layout_appendix_e7]
    language_policy: [korean_prose_english_identifiers]
  environmental_condition:
    dependency_lock: [hash_locked_closure]
    network_connectivity: [initial_fetch_then_offline]
  dynamic_element:
    concurrent_agents: int count

MODULES:
  agentic_knowledge_base:            # → id:odd-agentic-knowledge-base (스코프의 agt:subsetOf 가 참조)
    title: {en: "agentic-knowledge-base ODD v0.3", ko: "agentic-knowledge-base 운영 설계 영역 v0.3"}
    is_root: true
    is_active: true
    INCLUDE_AND:
      build_system: bazel_9_2_bzlmod
      python_runtime: hermetic_python_3_11
      repository_layout: kb_layout_appendix_e7
      language_policy: korean_prose_english_identifiers
      dependency_lock: hash_locked_closure
      network_connectivity: initial_fetch_then_offline
      concurrent_agents: "[0 .. 5] count"

EXCLUDE_WHEN_UNKNOWN: true           # 값이 unknown 인 속성은 ODD 밖으로 본다 (= restrictive)

ATTRIBUTES:                          # 속성 ↔ 그래프 개체. 스코프·가정은 이 IRI 를 참조한다 (3.3절 ODD 참조 게이트)
  build_system:         {iri: "id:cond-build-system",      title: build system,         title_ko: 빌드 체계}
  python_runtime:       {iri: "id:cond-python-runtime",    title: python runtime,       title_ko: 파이썬 런타임}
  repository_layout:    {iri: "id:cond-repo-layout",       title: repository layout,    title_ko: 저장소 구조}
  language_policy:      {iri: "id:cond-language-policy",   title: language policy,      title_ko: 언어 정책}
  dependency_lock:      {iri: "id:cond-dependency-lock",   title: dependency lock,      title_ko: 의존성 고정}
  network_connectivity: {iri: "id:cond-network",           title: network connectivity, title_ko: 네트워크 연결성}
  concurrent_agents:    {iri: "id:cond-concurrent-agents", title: concurrent agents,    title_ko: 동시 에이전트 수}

LITERALS:                            # 범주 리터럴의 뜻 (사람이 읽는 값). agt:conditionValue 에 들어간다
  bazel_9_2_bzlmod:                  "Bazel 9.2.0 + bzlmod, rules_python 2.3.2"
  hermetic_python_3_11:              "hermetic Python 3.11 (rules_python toolchain)"
  kb_layout_appendix_e7:             "kb/{ontology,odd,dev,vv}/ kg/ chunks/ tools/ defs/ docs/ .claude/ — 접미사 규약은 0.2절, 한 청크는 한 파일, 저장 구조는 노트 부록 E.7. docs/·.claude/는 그래프 밖"
  korean_prose_english_identifiers:  "산문 한글, 식별자 영어 케밥, 라벨 한/영 1:1 (0.6절)"
  hash_locked_closure:               "rdflib 7.6.0, pyshacl 0.40.0, owlrl 7.6.2, pyyaml 6.0.2 — 전체 폐포 해시 고정. 플랫폼 휠은 호스트 휠 + sdist 두 해시"
  initial_fetch_then_offline:        "최초 fetch 시 BCR·PyPI 접근 필요, 이후 오프라인 빌드 가능"

CHECKS:                              # 판정 방법·등급 (3.2절, 3.9절). cel 은 도입 5단계에서 채운다
  build_system:         {grade: A, method: ".bazelversion 파일 내용 = 9.2.0; bazel test //... 성공"}
  python_runtime:       {grade: A, method: "MODULE.bazel의 python.toolchain(python_version = \"3.11\")"}
  repository_layout:    {grade: A, method: "bazel test //:naming_test (접미사 린트) + //chunks:lint_test + //kb/dev:lint_test"}
  language_policy:      {grade: B, method: "bazel test //kb/ontology:gate_test 의 labels 검사 (한/영 라벨 강제)"}
  dependency_lock:      {grade: A, method: "tools/requirements_lock.txt 존재 + bazel fetch 성공"}
  network_connectivity: {grade: A, method: "curl -sI https://bcr.bazel.build → 200 (최초 1회)"}
  concurrent_agents:    {grade: B, method: "kg/catalog-kg.ttl 의 agt:maxConcurrent 합 ≤ 5 (orchestrator·developer·vnv·inspection·hci 각 1), 그리고 실행 중 활성 세션·dispatch 수 확인"}

EXCLUSIONS_REVIEWED:                 # 검토 뒤 명시 제외 (3.2절)
  - {concept: "원격 실행·원격 캐시(RBE)", reviewed: 2026-09, reason: "로컬 개발 전용 단계"}
  - {concept: "CI 파이프라인", reviewed: 2026-09, reason: "Part XIV 1단계 범위 밖, 게이트가 안정된 뒤 도입"}
  - {concept: "참조 저장소(harness-functional·harness-concrete) 빌드 의존", reviewed: 2026-09, reason: "내용을 청크로 승격해 활용하고(prov:wasDerivedFrom), 프로젝트 자체는 직접 사용하지 않는다"}
